# Host nginx site for the TG Analyst web UI.
# Install:  sudo cp deploy/nginx/tg-analyst.naurzalinov.me.conf /etc/nginx/sites-enabled/
#           sudo certbot --nginx -d tg-analyst.naurzalinov.me   # adds the HTTPS server block
#
# The app has no login of its own and can start scraping jobs with the owner's Telegram
# account, so it is protected with HTTP basic auth (/etc/nginx/.htpasswd-tg-analyst).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name tg-analyst.naurzalinov.me;
    listen 80;
    listen [::]:80;

    auth_basic "TG Analyst";
    auth_basic_user_file /etc/nginx/.htpasswd-tg-analyst;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit talks to the browser over a WebSocket (/_stcore/stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Health check stays open for uptime monitors.
    location = /_stcore/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8501;
    }
}
