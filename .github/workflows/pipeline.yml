name: Pipeline

# Pull requests: CI + arm64 image build (no push, no deploy).
# Push to main: CI, then build & push ghcr.io/42-activities/tg_analyst-app:<sha>,
# then deploy to the server over SSH with health check and automatic rollback.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    uses: ./.github/workflows/docker-deploy.yml
    with:
      images: '[{"name": "app", "context": "."}]'
      deploy-path: ~/projects/tg_analyst
      health-url: http://127.0.0.1:8501/_stcore/health
    secrets: inherit
