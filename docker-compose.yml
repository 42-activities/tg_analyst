# Local stack: PostgreSQL, web UI, job worker and the tg-analyst CLI.
#
#   docker compose run --rm app login                     # once: Telegram login code prompt
#   docker compose up -d                                  # db + web (http://localhost:8501) + worker
#   docker compose run --rm app seed                      # optional synthetic demo data
#   docker compose --profile live up -d listener          # stream new messages
#
# The web UI has no authentication: it is bound to 127.0.0.1 only. Reach it remotely
# through an SSH tunnel (ssh -L 8501:localhost:8501 server) rather than exposing it.
#
# Telegram credentials come from .env (see .env.example).

x-app: &app
  build: .
  image: tg-analyst:local
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://tg_analyst:${POSTGRES_PASSWORD:-tg_analyst}@db:5432/tg_analyst
  volumes:
    # Holds the Telethon *.session file: it grants full account access.
    - tgdata:/app/data
  depends_on:
    db:
      condition: service_healthy
  stdin_open: true
  tty: true

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tg_analyst
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tg_analyst}
      POSTGRES_DB: tg_analyst
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tg_analyst"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off CLI: docker compose run --rm app <command>
  app:
    <<: *app
    profiles: ["cli"]

  web:
    <<: *app
    command: ["web", "--host", "0.0.0.0", "--port", "8501"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8501}:8501"
    stdin_open: false
    tty: false
    restart: unless-stopped

  worker:
    <<: *app
    command: ["worker"]
    stdin_open: false
    tty: false
    restart: unless-stopped

  listener:
    <<: *app
    profiles: ["live"]
    command: ["listen", "--group", "${TG_GROUP:-}"]
    stdin_open: false
    tty: false
    restart: unless-stopped

volumes:
  pgdata:
  tgdata:
