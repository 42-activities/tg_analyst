[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-analyst"
version = "0.1.0"
description = "Telegram community intelligence: relationships, tone and community health."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "vaderSentiment>=3.3.2",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.40",
    "plotly>=5.20",
    "pandas>=2.1",
    "networkx>=3.2",
    "snowballstemmer>=2.2",
    # Context topics: clustering of thread embeddings (the worker runs it, tests too).
    "scikit-learn>=1.4",
]
hf = [
    "transformers>=4.40",
    "torch>=2.2",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
# Claude summaries of context topics (optional; off without ANTHROPIC_API_KEY).
llm = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
tg-analyst = "tg_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tg_analyst.storage.migrations" = ["script.py.mako", "versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
