[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-analyst"
version = "0.1.0"
description = "Telegram community intelligence: relationships, tone and community health."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
tg-analyst = "tg_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
